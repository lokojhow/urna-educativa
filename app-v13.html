<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Urna Educativa</title><style>html,body,#app{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#071426}</style></head><body><iframe id="app" src="./app-v2.html?v=20260825-1412" allow="autoplay"></iframe><script>(async function(){const frame=document.getElementById('app'),stamp='20260825-1420';const parts=await Promise.all([0,1,2,3].map(i=>fetch(`./audio/new${i}.txt?v=${stamp}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Falha ao carregar áudio');return r.text()})));const b64=parts.join('').replace(/\s+/g,'');const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const AC=window.AudioContext||window.webkitAudioContext;const ctx=new AC();const buffer=await ctx.decodeAudioData(bytes.buffer.slice(0));let last=0;function playReal(){const now=Date.now();if(now-last<250)return;last=now;try{if(ctx.state==='suspended')ctx.resume();const src=ctx.createBufferSource();src.buffer=buffer;src.connect(ctx.destination);src.start(0)}catch(e){console.error('Som CONFIRMA',e)}}function install(){try{const w=frame.contentWindow,d=w.document;if(!d||d.readyState==='loading'){setTimeout(install,150);return}try{w.playConfirm=()=>Promise.resolve();w.playFinish=()=>Promise.resolve()}catch(e){}const b=d.getElementById('confirmBtn');if(b&&!b.dataset.audioReal){b.dataset.audioReal='1';b.addEventListener('pointerdown',playReal,{passive:true});b.addEventListener('touchstart',playReal,{passive:true});b.addEventListener('click',playReal,true)}}catch(e){setTimeout(install,200)}}frame.addEventListener('load',()=>setTimeout(install,100));setInterval(install,700);install()})().catch(e=>console.error('Áudio real da urna:',e));</script></body></html>

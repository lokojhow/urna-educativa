<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Urna Educativa</title><style>html,body,#app{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#071426}</style></head><body><iframe id="app" src="./app-v2.html?v=20260825-1431" allow="autoplay"></iframe><script>(async()=>{const host=document.getElementById('app');const ps=[0,1,2,3];const chunks=await Promise.all(ps.map(i=>fetch(`./audio/new${i}.txt?v=20260825-1431`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('audio');return r.text()})));const audio=new Audio('data:audio/mpeg;base64,'+chunks.join('').replace(/\s+/g,''));audio.preload='auto';await audio.load?.();function fire(){audio.pause();audio.currentTime=0;audio.volume=1;audio.play().catch(()=>{});}function bind(){try{const d=host.contentDocument,w=host.contentWindow;if(!d)return;w.playConfirm=()=>Promise.resolve();w.playFinish=()=>Promise.resolve();const b=d.getElementById('confirmBtn');if(b&&!b.dataset.mp3direct){b.dataset.mp3direct='1';b.addEventListener('pointerup',fire,true);b.addEventListener('click',fire,true);}}catch(e){}}host.addEventListener('load',()=>setTimeout(bind,100));setInterval(bind,500);})();</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Urna Educativa</title><style>html,body,#app{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#071426}</style></head><body><iframe id="app" src="./app-v2.html?v=20260825-1305" allow="autoplay"></iframe><script>(async function(){const app=document.getElementById('app'),stamp='20260825-1305';const files=Array.from({length:8},(_,i)=>`./audio/c${String(i).padStart(2,'0')}.txt?v=${stamp}`);let b64=(await Promise.all(files.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Falha ao carregar áudio');return r.text()})))).join('').replace(/\s+/g,'');let bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw Error('Navegador sem suporte ao áudio comprimido');let ds=new DecompressionStream('gzip');let ab=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();let url=URL.createObjectURL(new Blob([ab],{type:'audio/mpeg'}));let audio=new Audio(url);audio.preload='auto';audio.load();function unlock(){try{audio.volume=0;audio.currentTime=0;let p=audio.play();if(p&&p.then)p.then(()=>{audio.pause();audio.currentTime=0;audio.volume=1}).catch(()=>{});}catch(e){}}function play(){return new Promise(res=>{let done=false,finish=()=>{if(done)return;done=true;res()};try{audio.pause();audio.volume=1;audio.currentTime=0;audio.onended=finish;audio.onerror=finish;let p=audio.play();if(p&&p.catch)p.catch(finish);setTimeout(finish,8000)}catch(e){finish()}})}function install(){try{let w=app.contentWindow,d=w.document;if(!d||d.readyState==='loading'){setTimeout(install,250);return}w.playConfirm=play;w.playFinish=play;let b=d.getElementById('confirmBtn');if(b&&!b.dataset.exactSound){b.dataset.exactSound='1';b.addEventListener('pointerdown',unlock,{passive:true});b.addEventListener('touchstart',unlock,{passive:true})}}catch(e){setTimeout(install,300)}}app.addEventListener('load',()=>setTimeout(install,250));setInterval(install,1000);install()})().catch(e=>console.error('Áudio da urna:',e));</script></body></html>

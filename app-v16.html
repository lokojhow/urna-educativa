<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Urna Educativa</title><style>html,body,#app{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#071426}</style></head><body><iframe id="app" src="./app-v2.html?v=20260825-1445" allow="autoplay"></iframe><script>(async()=>{const host=document.getElementById('app');const stamp='20260825-1445';const parts=await Promise.all([0,1,2,3].map(i=>fetch(`./audio/new${i}.txt?v=${stamp}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Falha ao carregar MP3');return r.text()})));const b64=parts.join('').replace(/\s+/g,'');const bin=atob(b64);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);const AC=window.AudioContext||window.webkitAudioContext;const ctx=new AC();const buffer=await ctx.decodeAudioData(u8.buffer.slice(0));function tocar(){try{if(ctx.state==='suspended')ctx.resume();const s=ctx.createBufferSource();s.buffer=buffer;s.connect(ctx.destination);s.start(0);}catch(e){console.error(e)}}function bind(){try{const w=host.contentWindow,d=host.contentDocument;if(!d)return;try{w.eval('playConfirm=()=>Promise.resolve();playFinish=()=>Promise.resolve();')}catch(e){}const b=d.getElementById('confirmBtn');if(b&&!b.dataset.realMp3){b.dataset.realMp3='1';b.addEventListener('pointerdown',tocar,true);b.addEventListener('touchstart',tocar,{capture:true,passive:true});}}catch(e){}}host.addEventListener('load',()=>setTimeout(bind,100));setInterval(bind,400);bind();})().catch(e=>console.error('MP3 urna:',e));</script></body></html>

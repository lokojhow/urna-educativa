name: Patch password eyes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-password-eye.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add password visibility buttons
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'Pattern not found: {label}')
              return text.replace(old, new, 1)

          p = Path('admin-v3.html')
          s = p.read_text(encoding='utf-8')
          s = replace_once(
              s,
              '<div class="field"><label>Senha</label><input id="pass" type="password"></div>',
              '<div class="field"><label>Senha</label><div style="position:relative"><input id="pass" type="password" style="padding-right:52px"><button type="button" aria-label="Mostrar senha" onclick="const p=document.getElementById(\'pass\');p.type=p.type===\'password\'?\'text\':\'password\';this.textContent=p.type===\'password\'?\'👁\':\'🙈\'" style="position:absolute;right:5px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:22px;padding:5px;cursor:pointer">👁</button></div></div>',
              'admin login password'
          )
          s = replace_once(
              s,
              '<div class="field"><label>Senha temporária</label><input id="uPass" type="password" minlength="6"></div>',
              '<div class="field"><label>Senha temporária</label><div style="position:relative"><input id="uPass" type="password" minlength="6" style="padding-right:52px"><button type="button" aria-label="Mostrar senha temporária" onclick="const p=document.getElementById(\'uPass\');p.type=p.type===\'password\'?\'text\':\'password\';this.textContent=p.type===\'password\'?\'👁\':\'🙈\'" style="position:absolute;right:5px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:22px;padding:5px;cursor:pointer">👁</button></div></div>',
              'temporary password'
          )
          p.write_text(s, encoding='utf-8')

          p = Path('mobile-v3.html')
          s = p.read_text(encoding='utf-8')
          s = replace_once(
              s,
              '<div class="field"><label>Senha</label><input id="loginPass" type="password"></div>',
              '<div class="field"><label>Senha</label><div style="position:relative"><input id="loginPass" type="password" style="padding-right:52px"><button type="button" aria-label="Mostrar senha" onclick="const p=document.getElementById(\'loginPass\');p.type=p.type===\'password\'?\'text\':\'password\';this.textContent=p.type===\'password\'?\'👁\':\'🙈\'" style="position:absolute;right:5px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:22px;padding:5px;cursor:pointer">👁</button></div></div>',
              'researcher login password'
          )
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "OpenAI"
          git config user.email "actions@users.noreply.github.com"
          git add admin-v3.html mobile-v3.html
          if git diff --cached --quiet; then
            echo "Nothing to patch"
          else
            git commit -m "Adiciona olho para mostrar senha"
            git push
          fi

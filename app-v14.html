<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Urna Educativa</title><style>html,body,#app{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#071426}</style></head><body><iframe id="app" src="./app-v2.html?v=20260825-1428" allow="autoplay"></iframe><script>(async()=>{const host=document.getElementById('app');const parts=await Promise.all([0,1,2,3].map(i=>fetch(`./audio/new${i}.txt?v=20260825-1428`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Falha ao carregar áudio');return r.text()})));const src='data:audio/mpeg;base64,'+parts.join('').replace(/\s+/g,'');const audio=new Audio(src);audio.preload='auto';audio.load();function playExact(){try{audio.pause();audio.currentTime=0;audio.volume=1;const p=audio.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}}function install(){try{const w=host.contentWindow,d=w.document;if(!d||d.readyState==='loading'){setTimeout(install,200);return}w.playConfirm=()=>Promise.resolve();w.playFinish=()=>Promise.resolve();const b=d.getElementById('confirmBtn');if(b&&!b.dataset.exactRealAudio){b.dataset.exactRealAudio='1';b.addEventListener('click',playExact,true)}}catch(e){setTimeout(install,250)}}host.addEventListener('load',()=>setTimeout(install,200));setInterval(install,800);install()})().catch(e=>console.error(e));</script></body></html>

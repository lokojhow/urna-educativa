<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Urna Educativa"><meta name="theme-color" content="#071426"><title>Urna Educativa</title><style>html,body{margin:0;width:100%;height:100%;background:#071426;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="./mobile-v3.html?ios=1&v=120" allow="autoplay"></iframe><script>const f=document.getElementById('app');let a={key:'',confirm:'',finish:''};function play(src){if(!src)return;try{const x=new Audio(src);x.preload='auto';x.volume=1;x.play().catch(()=>{});}catch(e){}}function inject(){try{const w=f.contentWindow;w.NativeAudio={configure:(k,c,fi)=>{a.key=k||'';a.confirm=c||'';a.finish=fi||'';},playKey:()=>play(a.key),playConfirm:()=>play(a.confirm),playFinish:()=>play(a.finish||a.confirm)};}catch(e){}}f.addEventListener('load',()=>{inject();setTimeout(inject,300);setTimeout(inject,1200)});inject();</script></body></html>

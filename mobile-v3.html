<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Urna Educativa</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#071426;color:#111}button,input,select{font:inherit}button{touch-action:manipulation}.hidden{display:none!important}.top{height:48px;color:#fff;padding:0 12px;display:flex;align-items:center;justify-content:space-between}.top a,.top button{padding:8px 10px;border-radius:9px;border:1px solid #526078;background:#13223b;color:#fff;font-weight:800;text-decoration:none}.page{min-height:calc(100vh - 48px);padding:16px;background:#f3f5f7}.card{max-width:800px;margin:auto;background:#fff;border-radius:15px;padding:18px}h1{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:10px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #bbb;border-radius:9px;font-size:16px}.primary{padding:12px 16px;border:0;border-radius:9px;background:#1769cf;color:#fff;font-weight:900}.secondary{padding:12px 16px;border:1px solid #bbb;border-radius:9px;background:#fff;font-weight:900}.err{color:#a02020;font-size:13px;margin-top:8px}.muted{color:#667;font-size:13px}.modeGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.mode{padding:28px 18px;border:0;border-radius:18px;text-align:left;min-height:165px;font-weight:900;font-size:28px}.mode small{display:block;font-size:14px;font-weight:500;margin-top:10px}.research{background:#1769cf;color:#fff}.training{background:#e6edf6;color:#0b1b35}.me{background:#f7f8fa;border-radius:12px;padding:12px;margin-bottom:14px}.vote{padding:7px 10px 10px}.urna{background:#e4e1d8;border-radius:20px;padding:10px;display:grid;grid-template-columns:1.8fr .95fr;gap:10px;min-height:calc(100vh - 63px)}.screen{background:#f5f6ef;border:6px solid #292f34;border-radius:16px;padding:14px;position:relative}.office{font-size:28px;font-weight:900}.digits{display:flex;gap:7px;margin-top:12px}.digit{width:41px;height:51px;border:2px solid #111;background:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900}.cand{display:none;margin-top:10px;align-items:flex-end;justify-content:space-between}.cand.show{display:flex}.cand img{width:135px;height:150px;object-fit:cover;border:1px solid #999}.blank{display:none;font-size:36px;font-weight:900;margin-top:20px}.blank.show{display:block}.pad{background:#d2cfc7;border-radius:16px;padding:9px;display:flex;flex-direction:column}.keys{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:6px}.key{border:0;border-radius:8px;background:#1d2127;color:#fff;font-size:27px;font-weight:900}.ghost{visibility:hidden}.actions{height:61px;margin-top:8px;display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:6px}.action{border:0;border-radius:8px;font-weight:900}.white{background:#f5f5f5}.orange{background:#f18b20}.green{background:#2fa94a}.finish{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.finish b{font-size:88px}.finish span{font-weight:700;color:#555}.finishBtns{display:flex;gap:8px}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#dbeafe;color:#174ea6;font-size:12px;font-weight:900}@media(orientation:portrait){#voteView:before{content:'Gire o celular para a posição horizontal.';position:fixed;inset:0;background:#071426;color:#fff;z-index:999;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:24px;font-weight:900}}@media(max-width:800px){.grid,.modeGrid{grid-template-columns:1fr}}</style></head><body><div class="top"><b id="appTitle">Urna Educativa</b><div><a id="adminLink" class="hidden" href="./admin-v3.html">ADMIN</a><button id="logoutBtn" class="hidden">SAIR</button></div></div><section id="authView" class="page"><div class="card"><h1>Acesso do pesquisador</h1><div class="field"><label>E-mail</label><input id="loginEmail" type="email"></div><div class="field"><label>Senha</label><input id="loginPass" type="password"></div><button class="primary" id="loginBtn">ENTRAR</button><div class="err" id="authErr"></div></div></section><section id="modeView" class="page hidden"><div class="card"><div class="me"><strong id="researcherName"></strong><div id="routine" class="muted"></div></div><h1>Escolha o modo</h1><div class="modeGrid"><button class="mode research" id="researchMode">PESQUISA<small>Registra respostas no dashboard e impede participante repetido.</small></button><button class="mode training" id="trainingMode">TREINAMENTO<small>Ensina a usar a urna. Pode repetir e não grava votos.</small></button></div><div id="summary" class="muted" style="margin-top:14px"></div></div></section><section id="startView" class="page hidden"><div class="card"><div class="badge">MODO PESQUISA</div><h1>Iniciar entrevista</h1><p id="intro">Participação voluntária. Esta pesquisa não registra voto oficial.</p><div class="grid"><div class="field"><label>Nome do participante</label><input id="name"></div><div class="field" id="fPhone"><label>Telefone do participante *</label><input id="phone" inputmode="tel"></div><div class="field" id="fCity"><label>Município</label><input id="city"></div><div class="field" id="fDistrict"><label>Bairro / comunidade</label><input id="district"></div><div class="field" id="fAge"><label>Faixa etária</label><select id="age"><option value="">Selecione</option><option>16–24</option><option>25–34</option><option>35–44</option><option>45–59</option><option>60+</option></select></div><div class="field" id="fSex"><label>Sexo (opcional)</label><select id="sex"><option value="">Prefiro não informar</option><option>Feminino</option><option>Masculino</option><option>Outro</option></select></div></div><label id="consentWrap" style="display:flex;gap:9px;background:#f7f8f9;padding:11px;border-radius:9px;margin:14px 0"><input type="checkbox" id="consent" style="width:22px;height:22px"><span>Fui informado(a) de que a participação é voluntária e autorizo o registro das respostas desta entrevista.</span></label><div style="display:flex;gap:8px"><button class="primary" id="startBtn">INICIAR NA URNA</button><button class="secondary" id="backMode">VOLTAR</button></div><div class="err" id="startErr"></div></div></section><section id="voteView" class="hidden"><div class="vote"><div class="urna"><div class="screen" id="screen"><small id="voteModeLabel">SEU VOTO PARA</small><div class="office" id="office"></div><div>Digite o número do candidato.</div><div class="digits" id="digits"></div><div class="cand" id="cand"><div><h2 id="cname"></h2><b id="cparty"></b></div><img id="cphoto"></div><div class="blank" id="blankLabel">VOTO EM BRANCO</div></div><div class="pad"><div class="keys"><button class="key" data-n="1">1</button><button class="key" data-n="2">2</button><button class="key" data-n="3">3</button><button class="key" data-n="4">4</button><button class="key" data-n="5">5</button><button class="key" data-n="6">6</button><button class="key" data-n="7">7</button><button class="key" data-n="8">8</button><button class="key" data-n="9">9</button><span class="ghost"></span><button class="key" data-n="0">0</button><span class="ghost"></span></div><div class="actions"><button class="action white" id="blankBtn">BRANCO</button><button class="action orange" id="correctBtn">CORRIGE</button><button class="action green" id="confirmBtn">CONFIRMA</button></div></div></div></div></section><script>const SB='https://dxvqiiawthxwkypvsxci.supabase.co',KEY='sb_publishable_Zno2VuYH9oev89OpttorUA_wzNb0EP6',API=SB+'/functions/v1/urna-pesquisa-api';const $=x=>document.getElementById(x);let session=null,profile=null,cargos=[],cands=[],cfg={layout:{},sons:{},pesquisa:{}},step=0,typed='',blank=false,sen1=null,interview=null,mode='pesquisa';function show(id){['authView','modeView','startView','voteView'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function ah(){return session?{'Authorization':'Bearer '+session.access_token}:{}}async function sj(url,opt={}){opt.headers={'apikey':KEY,'Content-Type':'application/json',...(opt.headers||{})};let r=await fetch(SB+url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error_description||d.msg||d.message||'Erro');return d}async function api(action,opt={}){opt.headers={...ah(),'Content-Type':'application/json',...(opt.headers||{})};let r=await fetch(API+'?action='+action,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erro de comunicação');return d}function saveSession(s){session=s;localStorage.setItem('urna_session',JSON.stringify(s))}function clearSession(){session=null;localStorage.removeItem('urna_session')}async function loadConfig(){let r=await fetch(SB+'/rest/v1/urna_configuracoes?select=chave,valor',{headers:{apikey:KEY,...ah()}}),d=await r.json();(d||[]).forEach(x=>cfg[x.chave]=x.valor||{});let l=cfg.layout||{},s=cfg.sons||{};$('appTitle').textContent=l.titulo||'Urna Educativa';$('intro').textContent=l.texto_abertura||'Participação voluntária. Esta pesquisa não registra voto oficial.';$('fPhone').classList.toggle('hidden',l.mostrar_telefone===false);$('fCity').classList.toggle('hidden',l.mostrar_municipio===false);$('fDistrict').classList.toggle('hidden',l.mostrar_bairro===false);$('fAge').classList.toggle('hidden',l.mostrar_faixa_etaria===false);$('fSex').classList.toggle('hidden',l.mostrar_sexo===false);$('consentWrap').classList.toggle('hidden',l.mostrar_consentimento===false);if(window.NativeAudio&&NativeAudio.configure)NativeAudio.configure(s.tecla_data||'',s.confirmacao_data||'',s.fim_data||'')}async function enterApp(){try{let b=await api('bootstrap');profile=b.pesquisador;cargos=b.cargos||[];cands=b.candidatos||[];await loadConfig();$('researcherName').textContent=profile.nome;$('routine').textContent='Meta diária: '+(profile.meta_diaria||10)+' entrevistas'+(profile.horario_inicio?' • Rotina '+profile.horario_inicio.slice(0,5)+(profile.horario_fim?'–'+profile.horario_fim.slice(0,5):''):'');$('adminLink').classList.toggle('hidden',profile.papel!=='admin');$('logoutBtn').classList.remove('hidden');try{let s=await api('my-summary');let today=new Date().toDateString(),n=(s.entrevistas||[]).filter(e=>new Date(e.iniciada_em).toDateString()===today&&e.status==='concluida').length;$('summary').textContent='Hoje: '+n+' entrevistas concluídas de '+(profile.meta_diaria||10)+' da meta.'}catch(e){}show('modeView')}catch(e){clearSession();show('authView');$('authErr').textContent=e.message}}async function login(){$('authErr').textContent='';try{let d=await sj('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('loginEmail').value.trim(),password:$('loginPass').value})});saveSession(d);await enterApp()}catch(e){$('authErr').textContent=e.message}}function keySound(){if((cfg.sons||{}).tecla_ativo===false)return;if(window.NativeAudio&&NativeAudio.playKey)NativeAudio.playKey()}function playConfirm(){if((cfg.sons||{}).confirmacao_ativo===false)return;if(window.NativeAudio&&NativeAudio.playConfirm)NativeAudio.playConfirm()}function playFinish(){if((cfg.sons||{}).fim_ativo===false)return;if(window.NativeAudio&&NativeAudio.playFinish)NativeAudio.playFinish();else playConfirm()}function office(){return cargos[step]||null}function current(){let o=office();return o?cands.find(c=>c.cargo_id===o.id&&String(c.numero)===typed)||null:null}function resetVote(){step=0;typed='';blank=false;sen1=null;interview=null}function beginVote(m){mode=m;resetVote();$('voteModeLabel').textContent=m==='treino'?'TREINAMENTO • SEU VOTO PARA':'PESQUISA • SEU VOTO PARA';show('voteView');render()}function render(){if(step>=cargos.length){$('screen').innerHTML='<div class="finish"><b>FIM</b><span>'+(mode==='treino'?'Treinamento concluído — nenhum dado foi gravado.':'Pesquisa concluída e registrada.')+'</span><div class="finishBtns"><button class="primary" onclick="finishAgain()">'+(mode==='treino'?'NOVO TREINAMENTO':'NOVA PESQUISA')+'</button><button class="secondary" onclick="goMenu()">MENU</button></div></div>';return}let o=office();$('office').textContent=o.nome;$('digits').innerHTML='';for(let i=0;i<o.digitos;i++){let d=document.createElement('div');d.className='digit';d.textContent=typed[i]||'';$('digits').appendChild(d)}let c=current();$('blankLabel').classList.toggle('show',blank);if(!blank&&c&&typed.length===o.digitos){$('cname').textContent=c.nome;$('cparty').textContent=(c.partido?c.partido+' • ':'')+c.numero;if(c.foto_url){$('cphoto').src=c.foto_url;$('cphoto').style.display='block'}else $('cphoto').style.display='none';$('cand').classList.add('show')}else $('cand').classList.remove('show')}function tap(n){let o=office();if(!o||typed.length>=o.digitos)return;keySound();blank=false;typed+=n;render()}function correct(){typed='';blank=false;render()}function voteBlank(){keySound();typed='';blank=true;render()}async function startResearch(){if((cfg.layout||{}).mostrar_consentimento!==false&&!$('consent').checked)return $('startErr').textContent='Confirme a participação voluntária.';if((cfg.pesquisa||{}).telefone_obrigatorio!==false&&$('phone').value.replace(/\D/g,'').length<8)return $('startErr').textContent='Informe o telefone do participante.';$('startErr').textContent='';try{let d=await api('start',{method:'POST',body:JSON.stringify({nome:$('name').value,telefone:$('phone').value,municipio:$('city').value,bairro:$('district').value,faixa_etaria:$('age').value,sexo:$('sex').value,consentimento:true})});interview=d.entrevista_id;mode='pesquisa';step=0;typed='';blank=false;sen1=null;$('voteModeLabel').textContent='PESQUISA • SEU VOTO PARA';show('voteView');render()}catch(e){$('startErr').textContent=e.message}}async function confirmVote(){let o=office(),c=current();if(!o)return;if(!blank&&typed.length!==o.digitos)return alert('Complete o número.');if(o.codigo==='senador_1'&&c)sen1=c.numero;if(o.codigo==='senador_2'&&c&&c.numero===sen1)return alert('Escolha outro candidato para o segundo voto de senador.');let last=step===cargos.length-1;playConfirm();$('confirmBtn').disabled=true;try{if(mode==='pesquisa'){let tipo=blank?'branco':(c?'candidato':'nulo');await api('answer',{method:'POST',body:JSON.stringify({entrevista_id:interview,cargo_id:o.id,candidato_id:c?c.id:null,numero_digitado:typed||null,tipo_resposta:tipo,ordem:step+1})});if(last)await api('finish',{method:'POST',body:JSON.stringify({entrevista_id:interview})})}step++;typed='';blank=false;if(last&&mode==='pesquisa'&&(cfg.sons||{}).fim_ativo===true&&((cfg.sons||{}).fim_data||''))setTimeout(playFinish,150);render()}catch(e){alert(e.message)}finally{$('confirmBtn').disabled=false}}window.finishAgain=()=>{if(mode==='treino')beginVote('treino');else{['name','phone','city','district'].forEach(x=>$(x).value='');$('age').value='';$('sex').value='';$('consent').checked=false;show('startView')}};window.goMenu=()=>show('modeView');document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>tap(b.dataset.n));$('blankBtn').onclick=voteBlank;$('correctBtn').onclick=correct;$('confirmBtn').onclick=confirmVote;$('loginBtn').onclick=login;$('researchMode').onclick=()=>show('startView');$('trainingMode').onclick=()=>beginVote('treino');$('startBtn').onclick=startResearch;$('backMode').onclick=()=>show('modeView');$('logoutBtn').onclick=async()=>{try{await sj('/auth/v1/logout',{method:'POST',headers:{Authorization:'Bearer '+session.access_token}})}catch(e){}clearSession();location.reload()};(()=>{try{let s=JSON.parse(localStorage.getItem('urna_session')||'null');if(s&&s.access_token){session=s;enterApp();return}}catch(e){}show('authView')})();</script></body></html>

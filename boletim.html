<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boletins • Urna Educativa</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f7;color:#111827}.top{background:#071426;color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}.top a{color:#fff;text-decoration:none;border:1px solid #526078;border-radius:9px;padding:8px 11px;font-weight:800}.wrap{max-width:980px;margin:auto;padding:16px}.card{background:#fff;border-radius:15px;padding:18px;margin-bottom:14px}.hidden{display:none!important}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid #bbc3ce;border-radius:9px;font-size:16px}.btn{border:0;border-radius:10px;padding:12px 15px;background:#1769cf;color:#fff;font-weight:900;cursor:pointer}.secondary{background:#667085}.buttons{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.cargoBtn{min-height:70px;font-size:15px}.cargoBtn.on{background:#071426}.muted{color:#667085;font-size:13px}.err{color:#b42318;margin-top:8px}.bu{background:#fff;border:2px solid #111;padding:22px;max-width:760px;margin:16px auto;font-family:'Courier New',monospace}.bu h1,.bu h2{text-align:center;margin:4px 0}.bu .sep{border-top:1px dashed #111;margin:13px 0}.row{display:flex;justify-content:space-between;gap:16px;padding:5px 0}.row strong:last-child{text-align:right}.candidate{border-top:1px dotted #777;padding:9px 0}.candidate:first-of-type{border-top:0}.candidate .name{font-weight:900}.meta{font-size:13px}.notice{border:1px solid #d0d5dd;background:#f9fafb;padding:10px;border-radius:9px;margin:10px 0}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}@media(max-width:820px){.buttons{grid-template-columns:1fr 1fr}.bu{padding:14px}}@media print{body{background:#fff}.top,.wrap>.card,.actions{display:none!important}.wrap{padding:0;max-width:none}.bu{border:0;max-width:none;margin:0;padding:0}.notice{border:1px solid #000}}</style></head><body><div class="top"><b>Urna Educativa • Boletins</b><a href="./admin-v4.html">VOLTAR AO ADMIN</a></div><div class="wrap"><div id="loginCard" class="card"><h2>Acesso administrativo</h2><p class="muted">Entre com a conta de administrador para gerar os boletins da pesquisa.</p><div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field"><label>Senha</label><input id="pass" type="password"></div><button class="btn" id="enter">ENTRAR</button><div id="loginErr" class="err"></div></div><div id="controls" class="card hidden"><h2>Gerar boletim por cargo</h2><p class="muted">Escolha o cargo. O boletim mostra todos os candidatos com votos, votos em branco, nulos, total de votos e percentuais.</p><div class="buttons"><button class="btn cargoBtn" data-cargo="Presidente">PRESIDENTE</button><button class="btn cargoBtn" data-cargo="Governador">GOVERNADOR</button><button class="btn cargoBtn" data-cargo="Deputado Federal">DEP. FEDERAL</button><button class="btn cargoBtn" data-cargo="Deputado Estadual">DEP. ESTADUAL</button><button class="btn cargoBtn" data-cargo="Senador">SENADOR</button></div></div><div id="output" class="hidden"></div></div><script>const SB='https://dxvqiiawthxwkypvsxci.supabase.co',KEY='sb_publishable_Zno2VuYH9oev89OpttorUA_wzNb0EP6',API=SB+'/functions/v1/urna-pesquisa-api';const $=id=>document.getElementById(id);let session=null,results=null,currentCargo='';async function auth(){const r=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('pass').value})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error_description||d.message||'Falha no login');session=d;localStorage.setItem('urna_session',JSON.stringify(d));return d}async function api(action){const r=await fetch(API+'?action='+action,{headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erro ao carregar os resultados');return d}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){results=await api('results');$('loginCard').classList.add('hidden');$('controls').classList.remove('hidden')}function normalizeCargo(n){n=String(n||'').toLowerCase();if(n.includes('presidente'))return'Presidente';if(n.includes('governador'))return'Governador';if(n.includes('deputado federal'))return'Deputado Federal';if(n.includes('deputado estadual'))return'Deputado Estadual';if(n.includes('senador'))return'Senador';return n}function bulletin(cargo){currentCargo=cargo;document.querySelectorAll('.cargoBtn').forEach(b=>b.classList.toggle('on',b.dataset.cargo===cargo));const rs=(results.respostas||[]).filter(r=>normalizeCargo(r.urna_cargos?.nome)===cargo);const total=rs.length,brancos=rs.filter(r=>r.tipo_resposta==='branco').length,nulos=rs.filter(r=>r.tipo_resposta==='nulo').length,validos=rs.filter(r=>r.tipo_resposta==='candidato').length;const map=new Map();for(const r of rs){if(r.tipo_resposta!=='candidato')continue;const nome=r.urna_candidatos?.nome||'Candidato',numero=String(r.urna_candidatos?.numero||r.numero_digitado||''),partido=r.urna_candidatos?.partido||'',key=(r.candidato_id||numero||nome);const x=map.get(key)||{nome,numero,partido,votos:0};x.votos++;map.set(key,x)}const cand=[...map.values()].sort((a,b)=>b.votos-a.votos||a.nome.localeCompare(b.nome,'pt-BR'));const entrevistas=(results.entrevistas||[]).filter(e=>e.status==='concluida').length,now=new Date();const pct=n=>validos?((n/validos)*100).toFixed(2).replace('.',',')+'%':'0,00%';$('output').classList.remove('hidden');$('output').innerHTML=`<div class="actions"><button class="btn" onclick="window.print()">IMPRIMIR / SALVAR PDF</button><button class="btn secondary" onclick="copyText()">COPIAR RESUMO</button></div><div class="bu" id="printArea"><h1>BOLETIM DA PESQUISA</h1><h2>URNA EDUCATIVA</h2><div class="notice"><b>SIMULAÇÃO / PESQUISA NÃO OFICIAL</b><br>Este documento não é um Boletim de Urna da Justiça Eleitoral e não representa resultado eleitoral oficial.</div><div class="sep"></div><div class="row"><span>CARGO</span><strong>${esc(cargo.toUpperCase())}</strong></div><div class="row"><span>GERADO EM</span><strong>${esc(now.toLocaleString('pt-BR'))}</strong></div><div class="row"><span>ENTREVISTAS CONCLUÍDAS</span><strong>${entrevistas}</strong></div><div class="sep"></div><div class="row"><span>TOTAL DE VOTOS NESTE CARGO</span><strong>${total}</strong></div><div class="row"><span>VOTOS VÁLIDOS</span><strong>${validos}</strong></div><div class="row"><span>VOTOS EM BRANCO</span><strong>${brancos}</strong></div><div class="row"><span>VOTOS NULOS</span><strong>${nulos}</strong></div><div class="sep"></div><h2>RESULTADO POR CANDIDATO</h2>${cand.length?cand.map((c,i)=>`<div class="candidate"><div class="row"><span class="name">${i+1}º ${esc(c.nome)}</span><strong>${c.votos} voto(s)</strong></div><div class="meta">Nº ${esc(c.numero||'—')} ${c.partido?'• '+esc(c.partido):''} • ${pct(c.votos)} dos válidos</div></div>`).join(''):'<p style="text-align:center">Nenhum voto em candidato registrado.</p>'}<div class="sep"></div><div class="meta" style="text-align:center">Boletim gerado automaticamente pelo sistema Urna Educativa.</div></div>`;window.scrollTo({top:$('output').offsetTop,behavior:'smooth'})}window.copyText=async()=>{if(!currentCargo)return;const rs=(results.respostas||[]).filter(r=>normalizeCargo(r.urna_cargos?.nome)===currentCargo),valid=rs.filter(r=>r.tipo_resposta==='candidato'),b=rs.filter(r=>r.tipo_resposta==='branco').length,n=rs.filter(r=>r.tipo_resposta==='nulo').length,map={};for(const r of valid){const nome=r.urna_candidatos?.nome||r.numero_digitado||'Candidato';map[nome]=(map[nome]||0)+1}const lines=[`BOLETIM DA PESQUISA — ${currentCargo.toUpperCase()}`,...Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k}: ${v}`),`Brancos: ${b}`,`Nulos: ${n}`,`Total: ${rs.length}`,'Pesquisa/simulação não oficial.'];await navigator.clipboard.writeText(lines.join('\n'));alert('Resumo copiado.')} ;document.querySelectorAll('.cargoBtn').forEach(b=>b.onclick=()=>bulletin(b.dataset.cargo));$('enter').onclick=async()=>{$('loginErr').textContent='';try{await auth();await load()}catch(e){$('loginErr').textContent=e.message}};(async()=>{try{session=JSON.parse(localStorage.getItem('urna_session')||'null')}catch(e){}if(session){try{await load()}catch(e){session=null;localStorage.removeItem('urna_session')}}})();</script></body></html>

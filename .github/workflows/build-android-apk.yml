name: Build Urna Educativa Offline APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile-v4.html'
      - 'offline-app.js'
      - 'admin-v4.html'
      - 'audio/confirm*.txt'
      - '.github/workflows/build-android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Create offline Android project
        shell: bash
        run: |
          mkdir -p android-app/app/src/main/java/com/urnaeducativa/app android-app/app/src/main/res/raw android-app/app/src/main/assets/photos
          cp mobile-v4.html offline-app.js admin-v4.html manifest.webmanifest android-app/app/src/main/assets/
          cat > android-app/app/src/main/assets/android-local.js <<'EOF'
          const __saveBootstrap=saveBootstrap;
          saveBootstrap=async function(b){
            if(location.protocol==='file:'&&b&&Array.isArray(b.candidatos)){
              b=JSON.parse(JSON.stringify(b));
              b.candidatos.forEach(c=>{if(c&&c.id)c.foto_url='./photos/'+c.id+'.jpg'});
            }
            const r=await __saveBootstrap(b);
            if(location.protocol==='file:')await put('meta',{id:'offlineReady',value:true,updatedAt:Date.now()});
            return r;
          };
          EOF
          sed -i 's#</body>#<script src="./android-local.js"></script></body>#' android-app/app/src/main/assets/mobile-v4.html
          python3 - <<'PY'
          import json, urllib.request, os, io, subprocess, sys
          from concurrent.futures import ThreadPoolExecutor, as_completed
          SB='https://dxvqiiawthxwkypvsxci.supabase.co'; KEY='sb_publishable_Zno2VuYH9oev89OpttorUA_wzNb0EP6'
          req=urllib.request.Request(SB+'/rest/v1/urna_candidatos?select=id,foto_url&ativo=eq.true',headers={'apikey':KEY})
          try: data=json.load(urllib.request.urlopen(req,timeout=60))
          except Exception as e: print('Lista de fotos indisponível',e); data=[]
          subprocess.run([sys.executable,'-m','pip','install','-q','Pillow'],check=False)
          try: from PIL import Image
          except Exception: Image=None
          out='android-app/app/src/main/assets/photos'; os.makedirs(out,exist_ok=True)
          def one(c):
            u,cid=c.get('foto_url'),c.get('id')
            if not u or not cid:return False
            try:
              rq=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}); raw=urllib.request.urlopen(rq,timeout=12).read(); path=os.path.join(out,str(cid)+'.jpg')
              if Image:
                im=Image.open(io.BytesIO(raw)).convert('RGB'); im.thumbnail((240,300)); im.save(path,'JPEG',quality=70,optimize=True)
              else: open(path,'wb').write(raw)
              return True
            except Exception:return False
          ok=fail=0
          with ThreadPoolExecutor(max_workers=20) as ex:
            fs=[ex.submit(one,c) for c in data]
            for i,f in enumerate(as_completed(fs),1):
              if f.result():ok+=1
              else:fail+=1
              if i%100==0:print('Fotos',i,'ok',ok,'falhas',fail)
          print('Fotos empacotadas',ok,'falhas',fail)
          PY
          cat > android-app/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='UrnaEducativa'; include ':app'
          EOF
          cat > android-app/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > android-app/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.urnaeducativa.app'; compileSdk 35; defaultConfig { applicationId 'com.urnaeducativa.app'; minSdk 26; targetSdk 35; versionCode 4; versionName '1.2.0' } }
          EOF
          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="Urna Educativa" android:usesCleartextTraffic="false"><activity android:name=".MainActivity" android:screenOrientation="sensorLandscape" android:configChanges="orientation|screenSize|keyboardHidden" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > android-app/app/src/main/java/com/urnaeducativa/app/MainActivity.java <<'EOF'
          package com.urnaeducativa.app;
          import android.app.Activity;import android.os.Bundle;import android.webkit.*;import android.net.Uri;import android.content.*;import android.media.*;import android.util.Base64;import android.view.WindowManager;import java.io.*;
          public class MainActivity extends Activity {private WebView web;private ValueCallback<Uri[]> fileCallback;private static final int FILE_REQ=7712;private MediaPlayer player;private File keyFile,confirmFile,finishFile;
          @Override public void onCreate(Bundle b){super.onCreate(b);getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);web=new WebView(this);setContentView(web);WebSettings s=web.getSettings();s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);s.setDatabaseEnabled(true);s.setMediaPlaybackRequiresUserGesture(false);s.setAllowFileAccess(true);s.setAllowContentAccess(true);s.setAllowFileAccessFromFileURLs(true);s.setAllowUniversalAccessFromFileURLs(true);web.addJavascriptInterface(new AudioBridge(),"NativeAudio");web.setWebViewClient(new WebViewClient());web.setWebChromeClient(new WebChromeClient(){@Override public boolean onShowFileChooser(WebView v,ValueCallback<Uri[]> cb,FileChooserParams p){if(fileCallback!=null)fileCallback.onReceiveValue(null);fileCallback=cb;try{startActivityForResult(p.createIntent(),FILE_REQ);return true;}catch(Exception e){fileCallback=null;return false;}}});web.loadUrl("file:///android_asset/mobile-v4.html");}
          @Override protected void onActivityResult(int req,int result,Intent data){super.onActivityResult(req,result,data);if(req==FILE_REQ&&fileCallback!=null){fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(result,data));fileCallback=null;}}
          private File decodeData(String data,String name){try{if(data==null||data.length()<10)return null;int comma=data.indexOf(',');String b64=comma>=0?data.substring(comma+1):data;byte[] bytes=Base64.decode(b64,Base64.DEFAULT);File f=new File(getFilesDir(),name+".bin");try(FileOutputStream out=new FileOutputStream(f)){out.write(bytes);}return f;}catch(Exception e){return null;}}
          private void playFile(File f,int fallback){runOnUiThread(()->{try{if(player!=null){player.stop();player.release();}if(f!=null&&f.exists()){player=new MediaPlayer();player.setDataSource(f.getAbsolutePath());player.prepare();}else player=MediaPlayer.create(this,fallback);if(player!=null)player.start();}catch(Exception ignored){}});}
          public class AudioBridge {@JavascriptInterface public void configure(String key,String confirm,String finish){new Thread(()->{keyFile=decodeData(key,"key_custom");confirmFile=decodeData(confirm,"confirm_custom");finishFile=decodeData(finish,"finish_custom");}).start();}@JavascriptInterface public void playKey(){if(keyFile!=null)playFile(keyFile,R.raw.confirmacao);else runOnUiThread(()->{ToneGenerator t=new ToneGenerator(AudioManager.STREAM_MUSIC,55);t.startTone(ToneGenerator.TONE_PROP_BEEP,55);new android.os.Handler().postDelayed(t::release,90);});}@JavascriptInterface public void playConfirm(){playFile(confirmFile,R.raw.confirmacao);}@JavascriptInterface public void playFinish(){playFile(finishFile!=null?finishFile:confirmFile,R.raw.confirmacao);}}}
          EOF
          cat audio/confirm0.txt audio/confirm1.txt audio/confirm2.txt audio/confirm3.txt | tr -d '\r\n ' | base64 -d > android-app/app/src/main/res/raw/confirmacao.mp3
      - name: Build APK
        run: cd android-app && gradle --no-daemon assembleDebug
      - run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Urna-Educativa-v1.2-Offline.apk
      - uses: actions/upload-artifact@v4
        with: {name: Urna-Educativa-v1.2-Offline-APK, path: Urna-Educativa-v1.2-Offline.apk, retention-days: 30}

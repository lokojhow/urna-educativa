name: Build Urna Educativa APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile-v2.html'
      - 'admin-v2.html'
      - 'audio/confirmacao.b64'
      - '.github/workflows/build-android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p android-app/app/src/main/java/com/urnaeducativa/app
          mkdir -p android-app/app/src/main/res/raw
          cat > android-app/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'UrnaEducativa'
          include ':app'
          EOF
          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > android-app/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.urnaeducativa.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.urnaeducativa.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }
          }
          EOF
          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="Urna Educativa" android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:screenOrientation="sensorLandscape" android:configChanges="orientation|screenSize|keyboardHidden" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > android-app/app/src/main/java/com/urnaeducativa/app/MainActivity.java <<'EOF'
          package com.urnaeducativa.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.*;
          import android.net.Uri;
          import android.content.*;
          import android.media.*;
          import android.util.Base64;
          import android.view.WindowManager;
          import java.io.*;

          public class MainActivity extends Activity {
              private WebView web;
              private ValueCallback<Uri[]> fileCallback;
              private static final int FILE_REQ = 7712;
              private MediaPlayer player;
              private final Object audioLock = new Object();
              private File keyFile, confirmFile, finishFile;

              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  web.addJavascriptInterface(new AudioBridge(), "NativeAudio");
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient(){
                      @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p){
                          if(fileCallback!=null) fileCallback.onReceiveValue(null);
                          fileCallback=cb;
                          try { startActivityForResult(p.createIntent(), FILE_REQ); return true; }
                          catch(Exception e){ fileCallback=null; return false; }
                      }
                  });
                  web.loadUrl("https://lokojhow.github.io/urna-educativa/mobile-v2.html?apk=1");
              }

              @Override protected void onActivityResult(int req,int result,Intent data){
                  super.onActivityResult(req,result,data);
                  if(req==FILE_REQ && fileCallback!=null){
                      fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(result,data));
                      fileCallback=null;
                  }
              }

              @Override public void onBackPressed(){ if(web!=null && web.canGoBack()) web.goBack(); else super.onBackPressed(); }

              private File decodeData(String data,String name){
                  try{
                      if(data==null || data.length()<10) return null;
                      int comma=data.indexOf(',');
                      String b64=comma>=0?data.substring(comma+1):data;
                      byte[] bytes=Base64.decode(b64,Base64.DEFAULT);
                      File f=new File(getFilesDir(),name+".bin");
                      try(FileOutputStream out=new FileOutputStream(f)){out.write(bytes);} return f;
                  }catch(Exception e){return null;}
              }

              private void playFile(File f,int fallback){
                  runOnUiThread(()->{
                      synchronized(audioLock){
                          try{
                              if(player!=null){player.stop();player.release();player=null;}
                              if(f!=null && f.exists()){
                                  player=new MediaPlayer(); player.setDataSource(f.getAbsolutePath()); player.prepare();
                              } else player=MediaPlayer.create(MainActivity.this,fallback);
                              if(player!=null){ player.setOnCompletionListener(mp->{try{mp.release();}catch(Exception ignored){} if(player==mp)player=null;}); player.start(); }
                          }catch(Exception e){try{if(player!=null)player.release();}catch(Exception ignored){} player=null;}
                      }
                  });
              }

              public class AudioBridge {
                  @JavascriptInterface public void configure(String key,String confirm,String finish){
                      new Thread(()->{
                          keyFile=decodeData(key,"key_custom");
                          confirmFile=decodeData(confirm,"confirm_custom");
                          finishFile=decodeData(finish,"finish_custom");
                      }).start();
                  }
                  @JavascriptInterface public void playKey(){
                      if(keyFile!=null && keyFile.exists()) playFile(keyFile,R.raw.confirmacao);
                      else runOnUiThread(()->{ToneGenerator t=new ToneGenerator(AudioManager.STREAM_MUSIC,55);t.startTone(ToneGenerator.TONE_PROP_BEEP,55);new android.os.Handler().postDelayed(t::release,90);});
                  }
                  @JavascriptInterface public void playConfirm(){ playFile(confirmFile,R.raw.confirmacao); }
                  @JavascriptInterface public void playFinish(){ playFile(finishFile!=null?finishFile:confirmFile,R.raw.confirmacao); }
              }
          }
          EOF
          tr -d '\r\n ' < audio/confirmacao.b64 | base64 -d > android-app/app/src/main/res/raw/confirmacao.mp3
          test -s android-app/app/src/main/res/raw/confirmacao.mp3
      - name: Build APK
        run: cd android-app && gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Urna-Educativa.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Urna-Educativa-APK
          path: Urna-Educativa.apk
          retention-days: 30

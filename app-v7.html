<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Urna Educativa</title><style>html,body,#app{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#071426}#snd{display:none}</style></head><body><iframe id="app" src="./app-v2.html?v=20260825-1105" allow="autoplay"></iframe><iframe id="snd" src="./app-v3.html?v=20260825-1105"></iframe><script>(function(){const app=document.getElementById('app'),snd=document.getElementById('snd');let src=null,audio=null,ready=false;function getSound(){try{src=snd.contentWindow.eval('URNA_SOUND');if(src&&!audio){audio=new Audio(src);audio.preload='auto';audio.load();}}catch(e){}return !!audio}function unlock(){if(!getSound())return;try{audio.volume=0;audio.currentTime=0;const p=audio.play();if(p&&p.then)p.then(()=>{audio.pause();audio.currentTime=0;audio.volume=1;ready=true}).catch(()=>{});}catch(e){}}function play(){return new Promise(res=>{if(!getSound()){res();return}try{audio.pause();audio.volume=1;audio.currentTime=0;audio.onended=res;audio.onerror=res;const p=audio.play();if(p&&p.catch)p.catch(()=>res());setTimeout(res,3500);}catch(e){res();}})}function install(){try{const w=app.contentWindow,d=w.document;if(!d||d.readyState==='loading'){setTimeout(install,250);return}if(!getSound()){setTimeout(install,250);return}w.playConfirm=play;w.playFinish=play;const b=d.getElementById('confirmBtn');if(b&&!b.dataset.audioFix){b.dataset.audioFix='1';b.addEventListener('pointerdown',unlock,{passive:true});b.addEventListener('touchstart',unlock,{passive:true});}ready=true;}catch(e){setTimeout(install,300)}}app.addEventListener('load',()=>setTimeout(install,250));snd.addEventListener('load',()=>setTimeout(install,250));setInterval(install,1200);})();</script></body></html>

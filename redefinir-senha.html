<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><title>Redefinir senha • Urna Educativa</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#071426;color:#111;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(460px,100%);background:#fff;border-radius:16px;padding:22px}h1{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input{width:100%;padding:12px;border:1px solid #bbb;border-radius:9px;font-size:16px}.btn{width:100%;padding:12px 16px;border:0;border-radius:9px;background:#1769cf;color:white;font-weight:900;font-size:16px}.secondary{margin-top:10px;background:#eef3f8;color:#16324f}.msg{font-size:14px;margin-top:12px}.ok{color:#167c3b}.err{color:#a02020}.muted{color:#667;font-size:13px}</style></head><body><div class="card"><h1>Redefinir senha</h1><div id="requestBox"><p class="muted">Informe o e-mail da sua conta. Você receberá um link para criar uma nova senha.</p><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email"></div><button class="btn" id="send">ENVIAR LINK DE REDEFINIÇÃO</button><div id="requestMsg" class="msg"></div></div><div id="resetBox" style="display:none"><p class="muted">Crie uma nova senha com pelo menos 6 caracteres.</p><div class="field"><label>Nova senha</label><input id="pass" type="password" minlength="6" autocomplete="new-password"></div><div class="field"><label>Confirmar nova senha</label><input id="pass2" type="password" minlength="6" autocomplete="new-password"></div><button class="btn" id="save">SALVAR NOVA SENHA</button><div id="resetMsg" class="msg"></div></div><button class="btn secondary" onclick="location.href='./urna-educativa.html'">VOLTAR AO LOGIN</button></div><script>const SB='https://dxvqiiawthxwkypvsxci.supabase.co',KEY='sb_publishable_Zno2VuYH9oev89OpttorUA_wzNb0EP6',API=SB+'/functions/v1/urna-pesquisa-api';const $=id=>document.getElementById(id);const hash=new URLSearchParams(location.hash.slice(1)),access=hash.get('access_token'),type=hash.get('type');if(access&&type==='recovery'){$('requestBox').style.display='none';$('resetBox').style.display='block'}$('send').onclick=async()=>{const email=$('email').value.trim();$('requestMsg').textContent='';if(!email.includes('@'))return $('requestMsg').innerHTML='<span class="err">Informe um e-mail válido.</span>';try{const r=await fetch(API+'?action=request-password-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,redirect_to:location.origin+location.pathname})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Não foi possível enviar o link.');$('requestMsg').innerHTML='<span class="ok">Link enviado. Confira sua caixa de entrada e também o spam.</span>'}catch(e){$('requestMsg').innerHTML='<span class="err">'+e.message+'</span>'}};$('save').onclick=async()=>{const p=$('pass').value,p2=$('pass2').value;$('resetMsg').textContent='';if(p.length<6)return $('resetMsg').innerHTML='<span class="err">A senha precisa ter pelo menos 6 caracteres.</span>';if(p!==p2)return $('resetMsg').innerHTML='<span class="err">As senhas não conferem.</span>';try{const r=await fetch(SB+'/auth/v1/user',{method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+access,'Content-Type':'application/json'},body:JSON.stringify({password:p})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error_description||'Não foi possível alterar a senha.');$('resetMsg').innerHTML='<span class="ok">Senha alterada com sucesso. Você já pode entrar no aplicativo.</span>';setTimeout(()=>location.href='./urna-educativa.html',1400)}catch(e){$('resetMsg').innerHTML='<span class="err">'+e.message+'</span>'}};</script></body></html>

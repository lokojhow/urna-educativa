<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard • Urna Educativa</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f5f7;color:#111}.top{background:#071426;color:#fff;padding:13px 16px;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none;border:1px solid #526078;padding:8px 11px;border-radius:9px}.wrap{max-width:1180px;margin:auto;padding:16px}.login,.card{background:#fff;border-radius:14px;padding:16px}.login{max-width:430px;margin:30px auto}.field{margin:10px 0}.field input,.field select{width:100%;padding:11px;border:1px solid #bbb;border-radius:9px;font-size:16px}button{border:0;background:#1769cf;color:#fff;padding:11px 15px;border-radius:9px;font-weight:900}.hidden{display:none!important}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.kpi{background:#fff;border-radius:12px;padding:14px}.kpi strong{display:block;font-size:30px}.kpi span{font-size:12px;color:#667}.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}.card h2{margin:0 0 12px;font-size:18px}.barLine{display:grid;grid-template-columns:minmax(110px,1fr) 2fr 48px;gap:8px;align-items:center;margin:8px 0;font-size:12px}.track{height:15px;background:#edf0f3;border-radius:8px;overflow:hidden}.fill{height:100%;background:#1769cf;border-radius:8px}.trend{display:flex;align-items:flex-end;gap:7px;height:150px;border-bottom:1px solid #ccd2d8;padding:8px 4px 0}.trendCol{flex:1;min-width:25px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.trendBar{width:70%;background:#1769cf;border-radius:5px 5px 0 0}.trendCol small{font-size:9px;margin-top:5px}.mini{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:7px 0;font-size:12px}.muted{color:#68707a;font-size:12px}.err{color:#a02020;margin-top:9px;font-size:13px}@media(max-width:850px){.kpis{grid-template-columns:repeat(2,1fr)}.grid,.mini{grid-template-columns:1fr}}</style></head><body><div class="top"><b>Dashboard • Pesquisa Eleitoral</b><a href="./">VOLTAR À URNA</a></div><div class="wrap"><div id="login" class="login"><h1>Dashboard</h1><p>Digite o código administrativo.</p><div class="field"><input id="code" type="password" placeholder="Código administrativo"></div><button id="go">ENTRAR</button><div id="err" class="err"></div></div><div id="dash" class="hidden"><div class="kpis"><div class="kpi"><strong id="k1">0</strong><span>Entrevistas</span></div><div class="kpi"><strong id="k2">0</strong><span>Concluídas</span></div><div class="kpi"><strong id="k3">0</strong><span>Em andamento</span></div><div class="kpi"><strong id="k4">0%</strong><span>Taxa de conclusão</span></div><div class="kpi"><strong id="k5">0</strong><span>Respostas</span></div></div><div class="grid"><div class="card"><h2>Resultado por cargo</h2><div class="field"><select id="cargo"></select></div><div id="votes"></div></div><div class="card"><h2>Entrevistas por dia</h2><div id="trend" class="trend"></div></div></div><div class="mini"><div class="card"><h2>Municípios</h2><div id="cities"></div></div><div class="card"><h2>Faixa etária</h2><div id="ages"></div></div><div class="card"><h2>Sexo</h2><div id="sex"></div></div><div class="card"><h2>Bairros / comunidades</h2><div id="districts"></div></div></div><div class="card" style="margin-top:14px"><h2>Entrevistas recentes</h2><div id="interviews"></div></div></div></div><script>const API='https://dxvqiiawthxwkypvsxci.supabase.co/functions/v1/urna-pesquisa-api';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function bars(o){let e=Object.entries(o||{}).sort((a,b)=>b[1]-a[1]),m=Math.max(1,...e.map(x=>x[1]));if(!e.length)return '<div class="muted">Sem dados ainda.</div>';return e.map(([n,v])=>'<div class="barLine"><span>'+esc(n)+'</span><div class="track"><div class="fill" style="width:'+Math.round(v/m*100)+'%"></div></div><b>'+v+'</b></div>').join('')}function render(d){let r=d.resumo||{};$('k1').textContent=r.total||0;$('k2').textContent=r.concluidas||0;$('k3').textContent=r.andamento||0;$('k4').textContent=(r.taxa_conclusao||0)+'%';$('k5').textContent=r.respostas||0;let cargos=Object.keys(d.agregados||{});$('cargo').innerHTML=cargos.map(c=>'<option>'+esc(c)+'</option>').join('');let draw=()=>$('votes').innerHTML=bars((d.agregados||{})[$('cargo').value]||{});$('cargo').onchange=draw;draw();$('cities').innerHTML=bars(d.municipios);$('ages').innerHTML=bars(d.faixas);$('sex').innerHTML=bars(d.sexos);$('districts').innerHTML=bars(d.bairros);let days=Object.entries(d.por_dia||{}).sort((a,b)=>a[0].localeCompare(b[0])),mx=Math.max(1,...days.map(x=>x[1]));$('trend').innerHTML=days.length?days.map(([day,v])=>'<div class="trendCol"><div class="trendBar" style="height:'+Math.max(5,Math.round(v/mx*110))+'px" title="'+v+'"></div><small>'+esc(day.slice(5))+'</small></div>').join(''):'<div class="muted">Sem dados ainda.</div>';$('interviews').innerHTML=(d.entrevistas||[]).slice(0,100).map(e=>{let p=e.participante||{},i=e.entrevistador||{};return '<div class="row"><span><b>'+esc(p.nome||'Participante')+'</b> · '+esc([p.municipio,p.bairro,p.faixa_etaria].filter(Boolean).join(' / '))+'</span><span>'+esc(e.status||'')+' · '+esc(i.nome||'')+'</span></div>'}).join('')||'Nenhuma entrevista.'}async function login(){let code=$('code').value.trim();$('err').textContent='';try{let r=await fetch(API+'?action=results',{headers:{'x-admin-code':code}}),d=await r.json();if(!r.ok)throw Error(d.error||'Erro');$('login').classList.add('hidden');$('dash').classList.remove('hidden');render(d)}catch(e){$('err').textContent=e.message}}$('go').onclick=login;$('code').onkeydown=e=>{if(e.key==='Enter')login()};</script></body></html>

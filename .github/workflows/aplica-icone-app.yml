name: Aplica ícone oficial do aplicativo
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/app-icon.b64'
      - '.github/workflows/aplica-icone-app.yml'
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar ícones Android e PWA
        run: |
          python3 -m pip install -q Pillow
          mkdir -p icons
          base64 -d assets/app-icon.b64 > /tmp/app-icon.jpg
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/app-icon.jpg').convert('RGBA')
          for size,name in [(192,'icons/icon-192.png'),(512,'icons/icon-512.png')]:
              x=im.resize((size,size),Image.Resampling.LANCZOS)
              x.save(name,'PNG',optimize=True)
          PY
          python3 - <<'PY'
          import json
          p='manifest.webmanifest'
          d=json.load(open(p,encoding='utf-8'))
          d['icons']=[
            {'src':'./icons/icon-192.png','sizes':'192x192','type':'image/png','purpose':'any maskable'},
            {'src':'./icons/icon-512.png','sizes':'512x512','type':'image/png','purpose':'any maskable'}
          ]
          open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile-v4.html')
          s=p.read_text(encoding='utf-8')
          tag='<link rel="apple-touch-icon" href="./icons/icon-192.png">'
          if tag not in s:
              if '</head>' in s: s=s.replace('</head>',tag+'\n</head>',1)
              else: s=tag+'\n'+s
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit ícones
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icons manifest.webmanifest mobile-v4.html
          git diff --cached --quiet || git commit -m 'Aplica ícone oficial no Android e iPhone'
          git push

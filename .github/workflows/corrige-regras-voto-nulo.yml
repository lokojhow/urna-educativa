name: Corrige regras de voto nulo
on:
  push:
    paths:
      - '.github/workflows/corrige-regras-voto-nulo.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correções
        run: python3 scripts/fix_vote_rules.py
      - name: Commitar correções
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add offline-app.js admin-v4.html
          git commit -m "Aplica regras de voto nulo e corrige nova pesquisa"
          git push

name: Repara painel administrativo
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/adiciona-reset-pesquisa.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reparar JavaScript do painel
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin-v3.html')
          s=p.read_text(encoding='utf-8')
          close='</script></body></html>'
          first=s.find(close)
          if first < 0: raise SystemExit('fechamento nao encontrado')
          s=s[:first+len(close)]
          js="""
async function resetPesquisaCompleta(){
 const aviso='ATENÇÃO: isto apagará TODAS as entrevistas, votos registrados, participantes e bloqueios de repetição.\\n\\nUsuários, equipes, candidatos e configurações serão mantidos.';
 if(!confirm(aviso))return;
 const palavra=prompt('Para confirmar, digite APAGAR exatamente como aparece abaixo:');
 if(palavra!=='APAGAR'){alert('Operação cancelada.');return;}
 const btn=$('resetPesquisa'),msg=$('resetMsg'); btn.disabled=true; msg.textContent='Apagando dados da pesquisa...';
 try{const r=await fetch(SB+'/functions/v1/urna-admin-reset-pesquisa',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({confirmacao:'APAGAR'})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Não foi possível apagar a pesquisa.');msg.textContent='Pesquisa apagada com sucesso.';alert('Pesquisa apagada com sucesso.');await loadAll();}catch(e){msg.textContent='';alert(e.message||String(e));}finally{btn.disabled=false;}
}
$('resetPesquisa').onclick=resetPesquisaCompleta;
"""
          pos=s.rfind('</script>')
          s=s[:pos]+js+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-v3.html
          git diff --cached --quiet || git commit -m 'Corrige travamento do login administrativo'
          git push

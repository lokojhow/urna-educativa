<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Urna Educativa</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{overflow:hidden}</style></head><body><iframe id="host" src="./app-v3.html?v=20260825-0943" allow="autoplay"></iframe><script>(function(){const host=document.getElementById('host');function install(){try{const w3=host.contentWindow,d3=w3.document,inner=d3.querySelector('iframe');if(!inner){setTimeout(install,300);return}const w=inner.contentWindow;if(!w||!w.document||w.document.readyState==='loading'){setTimeout(install,300);return}let src='';try{src=w3.eval('URNA_SOUND')}catch(e){}if(!src){setTimeout(install,500);return}const audio=new Audio(src);audio.preload='auto';function play(){return new Promise(res=>{try{audio.pause();audio.currentTime=0;audio.onended=res;audio.onerror=res;const p=audio.play();if(p&&p.catch)p.catch(()=>res());setTimeout(res,3500)}catch(e){res()}})}w.playConfirm=play;w.playFinish=play;const btn=w.document.getElementById('confirmBtn');if(btn)btn.addEventListener('pointerdown',()=>{try{audio.load()}catch(e){}},{passive:true});console.log('Som oficial da urna instalado');}catch(e){setTimeout(install,500)}}host.addEventListener('load',()=>setTimeout(install,300));setTimeout(install,1200)})();</script></body></html>
